[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidencegate"
version = "0.1.0"
description = "SIH26145 - EvidenceGate Product/Runtime Infrastructure MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8,<2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx>=0.27.0,<1"
]
benchmark = [
    "psutil>=5.9,<8"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "evidencegate/tests"
]
asyncio_mode = "auto"
